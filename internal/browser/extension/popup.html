<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; color: #18181b; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .row { margin: 8px 0; }
      .muted { color: #71717a; font-size: 12px; }
      .code { font: 600 22px ui-monospace, monospace; letter-spacing: 4px; }
      button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #d4d4d8; background: #fff; cursor: pointer; }
      button.primary { background: #18181b; color: #fff; border-color: #18181b; }
      input { font: 12px ui-monospace, monospace; width: 100%; box-sizing: border-box; padding: 5px; border: 1px solid #d4d4d8; border-radius: 6px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    </style>
  </head>
  <body>
    <h1>agent-tui</h1>
    <div class="row" id="status">…</div>
    <div class="row" id="tab"></div>
    <details class="row">
      <summary class="muted">Gateway</summary>
      <input id="gateway" />
      <div class="muted">The agent-tui gateway this extension works for.</div>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
